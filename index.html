<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>p4flat v1 / v2 / v3 - phone compare</title>
<style>
:root{--bg:#11141a;--panel:#171b22;--panel2:#1e242e;--line:#2a323e;--fg:#e6ebf2;
 --dim:#8b97a8;--accent:#54b3ff;--ok:#7ee29a;--warn:#e8c67e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
 font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
 touch-action:none}
#c{position:absolute;inset:0}
#topBar{position:absolute;left:10px;top:10px;z-index:6;display:flex;gap:8px}
#topBar button{min-height:44px;min-width:44px;padding:10px 14px;border-radius:12px;
 border:1px solid var(--line);background:#151a21ee;color:var(--fg);font-size:14px;
 font-weight:650;cursor:pointer;backdrop-filter:blur(8px)}
#topBar button:active{opacity:.85}
#ui{position:absolute;left:10px;top:62px;right:10px;max-width:340px;z-index:5;
 background:#151a21ee;border:1px solid var(--line);border-radius:12px;padding:12px 14px;
 backdrop-filter:blur(8px);max-height:calc(100% - 72px);overflow-y:auto}
#ui.collapsed{display:none}
#ui h1{margin:0 0 2px;font-size:15px;font-weight:650}
#ui .sub{color:var(--dim);font-size:11.5px;margin:0 0 10px}
.tabs{display:flex;gap:6px;margin:0 0 10px}
.tab{flex:1;min-height:44px;border-radius:9px;border:1px solid var(--line);
 background:var(--panel2);color:var(--dim);font-size:14px;font-weight:600;cursor:pointer}
.tab.on{border-color:var(--accent);color:#fff;background:#20304a}
.sect{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim);
 margin:12px 0 6px}
.part{display:flex;align-items:center;gap:10px;min-height:40px;padding:2px 0;
 font-size:13px;cursor:pointer;user-select:none}
.part input{width:20px;height:20px;accent-color:var(--accent);margin:0;flex:none}
.sw{width:12px;height:12px;border-radius:3px;flex:none}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.btn{min-height:40px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);
 background:var(--panel2);color:var(--fg);font-size:13px;cursor:pointer}
.btn.on{border-color:var(--accent);color:var(--accent)}
.btn:active{opacity:.85}
label.sl{display:block;font-size:12px;color:var(--dim);margin:4px 0 2px}
input[type=range]{width:100%;height:28px;accent-color:var(--accent)}
#bottomBar{position:absolute;left:10px;right:10px;bottom:max(10px, env(safe-area-inset-bottom));
 z-index:6;background:#151a21f2;border:1px solid var(--line);border-radius:14px;
 padding:10px 14px 12px;backdrop-filter:blur(10px);pointer-events:auto}
#bottomBar .slrow{display:flex;align-items:center;gap:12px}
#bottomBar .sllabel{flex:none;font-size:13px;font-weight:650;color:var(--fg);min-width:5.5em}
#bottomBar input[type=range]{flex:1;height:32px;margin:0;accent-color:var(--accent)}
#bottomBar .slval{flex:none;font-size:12px;color:var(--dim);min-width:2.6em;text-align:right;
 font-variant-numeric:tabular-nums}
#hud{position:absolute;left:12px;bottom:calc(78px + env(safe-area-inset-bottom));right:12px;color:var(--dim);font-size:11px;
 pointer-events:none;text-shadow:0 1px 2px #000;z-index:4}
#ver{position:absolute;right:12px;top:12px;z-index:4;text-align:right;
 pointer-events:none;text-shadow:0 1px 2px #000}
#ver b{display:block;font-size:15px}#ver span{color:var(--dim);font-size:11px}
#load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
 background:#11141acc;z-index:20;font-size:14px;color:var(--dim)}
#load.hide{display:none}
</style>
</head>
<body>
<div id="c"></div>
<div id="load">Loading meshes…</div>
<div id="topBar">
<button type="button" id="toggleUi" aria-expanded="false" aria-controls="ui">Controls</button>
<button type="button" id="recenter">Recenter</button>
</div>
<div id="ui" class="collapsed">
 <h1>p4flat compare</h1>
 <p class="sub">Orbit with one finger. Pinch to zoom. Two-finger drag to pan.</p>
 <div class="tabs">
 <button type="button" class="tab on" id="tabV3">v3 clean seat</button>
 <button type="button" class="tab" id="tabV2">v2 top ring + lugs</button>
 <button type="button" class="tab" id="tabV1">v1 baseline</button>
 </div>
 <div class="sect">Parts</div>
 <div id="parts"></div>
 <div class="row">
 <button type="button" class="btn on" id="spin">Auto-rotate</button>
 <button type="button" class="btn" id="reset">Reset view</button>
 <button type="button" class="btn" id="hideUi">Hide panel</button>
 </div>
</div>
<div id="ver"><b id="verLabel">v3 - clean top seat</b><span id="verSub">shelf ring only · lugs/screws out · RP_Z1=33</span></div>
<div id="bottomBar">
 <div class="slrow">
 <span class="sllabel">Separation</span>
 <input type="range" id="explode" min="0" max="100" value="0" aria-label="Separation">
 <span class="slval" id="explodeVal">0%</span>
 </div>
</div>
<div id="hud">Drag to orbit · pinch zoom · Recenter if it drifts</div>

<script src="three.min.js"></script>
<script src="OrbitControls.js"></script>
<script src="STLLoader.js"></script>
<script>
(function(){
const PARTS = [
 // explode vectors are model-space mm at Separation 100% before EXPLODE_SCALE
 // +Z up, +Y toward rear (jack face). Axes match real disassembly only.
 {id:'body', name:'Body', file:'p4flat_body.stl', color:0x6b8cae, explode:[0,0,0]},
 {id:'top', name:'Top', file:'p4flat_top.stl', color:0x54b3ff, explode:[0,0,42]},
 {id:'screen', name:'Screen mock', file:'p4flat_screen_mock.stl', color:0xb39ddb, explode:[0,0,42]},
 {id:'plate', name:'Base plate', file:'p4flat_plate.stl', color:0x7ee29a, explode:[0,0,-42]},
 {id:'board', name:'Board mock', file:'p4flat_board_mock.stl', color:0xe89a9a, explode:[0,0,-36]},
 {id:'rear', name:'Rear panel', file:'p4flat_rear.stl', color:0xe8c67e, explode:[0,55,0]},
];
const VERSIONS = {
 v3: {label:'v3 - clean top seat', sub:'shelf ring only · lid lugs/screws deferred · RP_Z1=33',
 badge:'v3', base:'v3/'},
 v2: {label:'v2 - top ring + lugs', sub:'RP_Z1=33 · side lid lugs + top screws · ~8 mm rear lintel',
 badge:'v2', base:'v2/'},
 v1: {label:'v1 - baseline', sub:'RP_Z1=39 · screws 8.5/35 · ~2 mm rear lintel',
 badge:'v1', base:'v1/'},
};

const ui = document.getElementById('ui');
const toggleUi = document.getElementById('toggleUi');
function setUiOpen(open){
 ui.classList.toggle('collapsed', !open);
 toggleUi.setAttribute('aria-expanded', open ? 'true' : 'false');
 toggleUi.textContent = open ? 'Hide' : 'Controls';
}
toggleUi.onclick = ()=> setUiOpen(ui.classList.contains('collapsed'));
document.getElementById('hideUi').onclick = ()=> setUiOpen(false);
document.getElementById('recenter').onclick = ()=> fitCamera();
// phone: start collapsed so the model is usable; wider screens can open
if(window.matchMedia('(min-width: 720px)').matches) setUiOpen(true);

const host = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x11141a, 1);
host.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x11141a, 280, 520);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth/window.innerHeight, 0.5, 2000);
camera.position.set(220, -200, 160);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(88, 68, 24);
controls.enableDamping = true;
controls.dampingFactor = 0.12;
controls.rotateSpeed = 0.55;
controls.zoomSpeed = 0.9;
controls.panSpeed = 0.7;
controls.enablePan = true;
controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
controls.autoRotate = false;
controls.autoRotateSpeed = 1.2;

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 0.75);
key.position.set(120, -80, 200); scene.add(key);
const fill = new THREE.DirectionalLight(0x88aacc, 0.35);
fill.position.set(-100, 60, 80); scene.add(fill);
const rim = new THREE.DirectionalLight(0xffe0b0, 0.25);
rim.position.set(40, 140, -60); scene.add(rim);

const root = new THREE.Group();
root.rotation.x = -Math.PI/2;
scene.add(root);

const loader = new THREE.STLLoader();
let current = 'v3';
let explode = 0;
const meshes = {};

function pathFor(ver, file){ return VERSIONS[ver].base + file; }

function clearMeshes(){
 Object.keys(meshes).forEach(id=>{
 const m = meshes[id].mesh;
 root.remove(m);
 if(m.geometry) m.geometry.dispose();
 if(m.material) m.material.dispose();
 delete meshes[id];
 });
}

function loadVersion(ver){
 current = ver;
 const meta = VERSIONS[ver];
 document.getElementById('verLabel').textContent = meta.label;
 document.getElementById('verSub').textContent = meta.sub;
 document.getElementById('tabV3').classList.toggle('on', ver==='v3');
 document.getElementById('tabV2').classList.toggle('on', ver==='v2');
 document.getElementById('tabV1').classList.toggle('on', ver==='v1');
 document.getElementById('load').classList.remove('hide');
 document.getElementById('load').textContent = 'Loading '+ver+' meshes…';
 clearMeshes();

 let left = PARTS.length;
 let failed = 0;
 PARTS.forEach(p=>{
 loader.load(pathFor(ver, p.file), geo=>{
 geo.computeVertexNormals();
 const mat = new THREE.MeshPhongMaterial({
 color: p.color, shininess: 28, specular: 0x2a2f38,
 flatShading: true, side: THREE.DoubleSide
 });
 const mesh = new THREE.Mesh(geo, mat);
 mesh.visible = true;
 root.add(mesh);
 meshes[p.id] = {mesh, base: mesh.position.clone(), exp: p.explode.slice(), part:p};
 left--;
 if(left===0) onLoaded(failed);
 }, undefined, err=>{
 console.warn('STL fail', p.file, err);
 failed++; left--;
 if(left===0) onLoaded(failed);
 });
 });
}

function onLoaded(failed){
 document.getElementById('load').classList.add('hide');
 applyExplode();
 fitCamera();
 if(failed){
 document.getElementById('hud').textContent =
 'Loaded with '+failed+' missing STL(s). Check network / reload.';
 }
}

// mm vectors below are modest; scale makes 100% a real exploded view on phone
const EXPLODE_SCALE = 4.0;
function applyExplode(){
 const t = (explode / 100) * EXPLODE_SCALE;
 Object.keys(meshes).forEach(id=>{
 const o = meshes[id];
 o.mesh.position.set(
 o.exp[0]*t,
 o.exp[1]*t,
 o.exp[2]*t
 );
 });
}

function fitCamera(){
 const box = new THREE.Box3();
 Object.keys(meshes).forEach(id=>{
 if(meshes[id].mesh.visible) box.expandByObject(meshes[id].mesh);
 });
 if(box.isEmpty()) return;
 // expandByObject is already world-space (includes root.rotation)
 const size = box.getSize(new THREE.Vector3());
 const center = box.getCenter(new THREE.Vector3());
 const maxDim = Math.max(size.x, size.y, size.z, 1);
 const dist = maxDim * 2.05;
 controls.target.copy(center);
 // front-ish three-quarter, model centered in the phone viewport
 camera.position.set(
  center.x + dist * 0.55,
  center.y + dist * 0.35,
  center.z + dist * 0.85
 );
 camera.near = Math.max(0.1, dist / 200);
 camera.far = dist * 20;
 camera.updateProjectionMatrix();
 controls.minDistance = maxDim * 0.35;
 controls.maxDistance = maxDim * 8;
 controls.update();
}

const partsEl = document.getElementById('parts');
PARTS.forEach(p=>{
 const row = document.createElement('label');
 row.className = 'part';
 row.innerHTML = '<input type="checkbox" checked data-id="'+p.id+'">' +
 '<span class="sw" style="background:#'+p.color.toString(16).padStart(6,"0")+'"></span>' +
 '<span>'+p.name+'</span>';
 partsEl.appendChild(row);
});
partsEl.addEventListener('change', e=>{
 const id = e.target.getAttribute('data-id');
 if(id && meshes[id]) meshes[id].mesh.visible = e.target.checked;
});

document.getElementById('tabV3').onclick = ()=> loadVersion('v3');
document.getElementById('tabV2').onclick = ()=> loadVersion('v3');
document.getElementById('tabV1').onclick = ()=> loadVersion('v1');
const explodeEl = document.getElementById('explode');
const explodeVal = document.getElementById('explodeVal');
function setExplode(v){
 explode = +v;
 explodeEl.value = explode;
 explodeVal.textContent = explode + '%';
 applyExplode();
}
explodeEl.oninput = e=> setExplode(e.target.value);
const spinBtn = document.getElementById('spin');
spinBtn.classList.remove('on');
spinBtn.onclick = function(){
 controls.autoRotate = !controls.autoRotate;
 this.classList.toggle('on', controls.autoRotate);
};
document.getElementById('reset').onclick = ()=>{
 setExplode(0);
 fitCamera();
};

window.addEventListener('resize', ()=>{
 camera.aspect = window.innerWidth/window.innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(window.innerWidth, window.innerHeight);
});

function tick(){
 requestAnimationFrame(tick);
 controls.update();
 renderer.render(scene, camera);
}
tick();
loadVersion('v2');
})();
</script>
</body>
</html>
